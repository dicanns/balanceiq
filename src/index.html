<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Replace unsafe-inline styles with nonce-based CSP when refactoring CSS -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://api.fontshare.com https://cdn.fontshare.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://*.supabase.co wss://*.supabase.co https://connect.squareup.com https://connect.squareupsandbox.com https://api.clover.com https://sandbox.dev.clover.com https://*.myshopify.com data: blob:; img-src 'self' data: blob:;" />
    <title>BalanceIQ</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet"/>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #F2F2F7; color: #1C1C1E; overflow-x: hidden; font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif; }
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; }
      .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      details > summary { list-style: none; }
      details > summary::-webkit-details-marker { display: none; }
      details > summary::after { content: " ▾"; font-size: 10px; opacity: 0.6; }
      details[open] > summary::after { content: " ▲"; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Electron 31 fetch patch: strip enum fields that cause "Invalid value" errors.
         Runs before any module code so ALL fetch calls (Supabase auth, REST, etc.) are covered. -->
    <script>
    (function(){
      var _orig=window.fetch.bind(window);
      var STRIP=['referrerPolicy','referrer','mode','cache','credentials','redirect','priority','duplex'];
      window.fetch=function(url,init){
        if(init&&typeof init==='object'){
          var opts=Object.assign({},init);
          STRIP.forEach(function(k){delete opts[k];});
          return _orig(url,opts);
        }
        return _orig(url,init);
      };
    })();
    </script>
    <script type="module" src="./index.jsx"></script>
  </body>
</html>
